{% extends "arena/base.html" %}
{% block title %}登入｜益智遊戲 AI 教練{% endblock %}
{% block content %}
  <h1 class="page-title">登入</h1>
  <form method="post" class="account-form">
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="status warn" role="alert">帳號或密碼不對，請再試一次。</p>{% endif %}
    <label>帳號 <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></label>
    <label>密碼 <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button primary">登入</button>
  </form>
  <p class="account-switch">還沒有帳號？<a href="{% url 'signup' %}">註冊一個</a></p>
{% endblock %}
