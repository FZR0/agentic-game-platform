{% extends "arena/base.html" %}
{% block title %}加入真人對戰｜益智遊戲 AI 教練{% endblock %}
{% block content %}
  <h1 class="page-title">加入真人對戰</h1>
  <p class="muted">輸入朋友給你的房間密碼（6 個字），或直接打開朋友傳來的邀請連結。只想看的話按「觀戰」，座位坐滿了也能看。</p>
  <form method="post" action="{% url 'arena:join' %}" class="account-form">
    {% csrf_token %}
    {% if error %}<p class="status warn" role="alert">{{ error }}</p>{% endif %}
    <label>房間密碼 <input type="text" name="code" value="{{ code }}" maxlength="8" autocomplete="off" required
      autocapitalize="characters" spellcheck="false"{% if not code %} autofocus{% endif %}></label>
    <div class="join-buttons">
      <button type="submit" name="action" value="join" class="button primary"{% if code %} autofocus{% endif %}>加入</button>
      {# 觀戰（2026-11-08）：不坐座位，只看所有人都看得到的部分 #}
      <button type="submit" name="action" value="watch" class="button">觀戰</button>
    </div>
  </form>
  <p class="account-switch">想自己開一盤？到<a href="{% url 'arena:home' %}#create-room">首頁</a>按「建立對戰房間」。</p>
{% endblock %}
