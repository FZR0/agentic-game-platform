{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}益智遊戲 AI 教練{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{% static 'arena/style.css' %}?v={{ asset_version }}">
</head>
<body>
  <header class="topbar site-bar">
    <a href="{% url 'arena:home' %}" class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">益智遊戲 AI 教練</span></a>
    <nav class="site-nav" aria-label="主要頁面">
      <a href="{% url 'arena:home' %}"{% if nav == "home" %} aria-current="page"{% endif %}>首頁</a>
      <a href="{% url 'arena:history' %}"{% if nav == "history" %} aria-current="page"{% endif %}>對局紀錄</a>
      <a href="{% url 'arena:guide' %}"{% if nav == "guide" %} aria-current="page"{% endif %}>怎麼玩</a>
    </nav>
  </header>
  <main class="page">
    {% if handled.notice %}<p class="status warn page-notice" role="status">{{ handled.notice }}</p>{% endif %}
    {% for message in messages %}<p class="status warn page-notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // 伺服器存的是 UTC 時間，這裡換成瀏覽器所在的時區顯示
    for (const el of document.querySelectorAll("time[datetime]")) {
      const when = new Date(el.getAttribute("datetime"));
      if (!Number.isNaN(when.getTime())) {
        el.textContent = when.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }
    }
  </script>
</body>
</html>
